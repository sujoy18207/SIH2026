# MPLADS AI RiskIntel — persistent server deployment
# The real eSAKSHI dataset (128K+ works, 108K vendor payments) requires a
# long-lived server with persistent storage; this compose stack replaces the
# former Vercel serverless setup.
#
#   docker compose up --build -d
#   → Frontend:  http://<host>:3000
#   → API docs:  http://<host>:3000/api/v1/docs  (Swagger at /docs on API port 8000)

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mplads-api
    restart: unless-stopped
    volumes:
      # Persistent SQLite database (built by the ETL on first boot)
      - mplads_db:/data
    environment:
      - MPLADS_DB=/data/mplads.db
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://inference.makora.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-ai/DeepSeek-V4-Flash}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s   # first boot runs the ETL over 128K works

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mplads-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  mplads_db:
